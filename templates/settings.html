{% extends 'base.html' %}
{% load static %}

{% block title %}系统设置 - 社区居民信息管理系统{% endblock %}

{% block page_title %}系统设置{% endblock %}

{% block content %}
<!-- 系统设置 -->
<section id="settings" class="page-section">
  <div class="bg-white rounded-lg shadow-sm p-6 mb-6">

    <!-- 设置选项卡 -->
    <div class="mb-6 border-b border-gray-200">
      <ul class="flex flex-wrap -mb-px">
        <li class="mr-2">
          <a href="#" class="inline-block p-4 border-b-2 border-primary text-primary font-medium text-sm">基本设置</a>
        </li>
        <li class="mr-2">
          <a href="#"
            class="inline-block p-4 border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 text-sm font-medium text-gray-500">用户管理</a>
        </li>
        <li class="mr-2">
          <a href="#"
            class="inline-block p-4 border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 text-sm font-medium text-gray-500">权限设置</a>
        </li>
        <li class="mr-2">
          <a href="#"
            class="inline-block p-4 border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 text-sm font-medium text-gray-500">数据备份</a>
        </li>
        <li class="mr-2">
          <a href="#"
            class="inline-block p-4 border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 text-sm font-medium text-gray-500">系统日志</a>
        </li>
      </ul>
    </div>

    <!-- 基本设置表单 -->
    <div>
      <form>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="community-name" class="block text-sm font-medium text-gray-700 mb-1">社区名称</label>
            <input type="text" id="community-name" value="阳光花园社区"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="community-address" class="block text-sm font-medium text-gray-700 mb-1">社区地址</label>
            <input type="text" id="community-address" value="上海市浦东新区阳光路123号"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="contact-phone" class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
            <input type="tel" id="contact-phone" value="021-12345678"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="contact-email" class="block text-sm font-medium text-gray-700 mb-1">联系邮箱</label>
            <input type="email" id="contact-email" value="info@yangguang.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div class="md:col-span-2">
            <label for="community-description" class="block text-sm font-medium text-gray-700 mb-1">社区描述</label>
            <textarea id="community-description" rows="3"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">阳光花园社区是一个现代化的居民小区，提供优质的居住环境和完善的社区服务。</textarea>
          </div>
        </div>

        <div class="mt-6">
          <h3 class="text-lg font-semibold text-gray-800 mb-4">系统配置</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="max-file-size" class="block text-sm font-medium text-gray-700 mb-1">最大文件上传大小 (MB)</label>
              <input type="number" id="max-file-size" value="10" min="1" max="100"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div>
              <label for="data-retention" class="block text-sm font-medium text-gray-700 mb-1">数据保留期限 (天)</label>
              <input type="number" id="data-retention" value="365" min="7" max="3650"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div class="md:col-span-2">
              <div class="flex items-center">
                <input type="checkbox" id="enable-notifications" checked
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                <label for="enable-notifications" class="ml-2 block text-sm text-gray-700">启用短信通知功能</label>
              </div>
            </div>
            <div class="md:col-span-2">
              <div class="flex items-center">
                <input type="checkbox" id="enable-email" checked
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                <label for="enable-email" class="ml-2 block text-sm text-gray-700">启用邮件通知功能</label>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8 flex justify-end">
          <button type="button"
            class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 mr-3">取消</button>
          <button type="submit"
            class="px-4 py-2 bg-primary text-white rounded-md text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">保存设置</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/settings.js' %}"></script>
{% endblock %}
