{% extends 'base.html' %}
{% load static %}

{% block title %}编辑居民 - 社区居民信息管理系统{% endblock %}

{% block page_title %}编辑居民{% endblock %}

{% block content %}
<!-- 编辑居民弹窗 -->
<div id="edit-resident-modal" style="z-index: 1000;" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center transition-all duration-300 ease-in-out opacity-100 pointer-events-auto">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden z-10 transform transition-all duration-300 ease-in-out scale-100">
    <!-- 弹窗头部 -->
    <div class="bg-primary text-white px-6 py-4 flex items-center justify-between">
      <h3 class="text-lg font-semibold">编辑居民</h3>
      <a href="/test/" class="text-white hover:text-gray-200 focus:outline-none">
        <i class="fa fa-times text-xl"></i>
      </a>
    </div>
    <!-- 弹窗内容 -->
    <div class="p-6 max-h-[70vh] overflow-y-auto">
      <form id="edit-resident-form" method="POST">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
            <input type="text" id="edit-resident-name" name="name" required value="{{ resident.name }}"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">性别</label>
            <select name="gender" id="edit-resident-gender"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="" {% if not resident.gender %}selected{% endif %}>请选择</option>
              <option value="1" {% if resident.gender == 1 %}selected{% endif %}>男</option>
              <option value="2" {% if resident.gender == 2 %}selected{% endif %}>女</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">民族</label>
            <select name="nationality" id="edit-resident-nationality"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="" {% if not resident.nationality %}selected{% endif %}>请选择</option>
              <option value="1" {% if resident.nationality == 1 %}selected{% endif %}>汉族</option>
              <option value="2" {% if resident.nationality == 2 %}selected{% endif %}>蒙古族</option>
              <option value="3" {% if resident.nationality == 3 %}selected{% endif %}>回族</option>
              <option value="4" {% if resident.nationality == 4 %}selected{% endif %}>藏族</option>
              <option value="5" {% if resident.nationality == 5 %}selected{% endif %}>维吾尔族</option>
              <option value="6" {% if resident.nationality == 6 %}selected{% endif %}>苗族</option>
              <option value="7" {% if resident.nationality == 7 %}selected{% endif %}>彝族</option>
              <option value="8" {% if resident.nationality == 8 %}selected{% endif %}>壮族</option>
              <option value="9" {% if resident.nationality == 9 %}selected{% endif %}>布依族</option>
              <option value="10" {% if resident.nationality == 10 %}selected{% endif %}>朝鲜族</option>
              <option value="11" {% if resident.nationality == 11 %}selected{% endif %}>满族</option>
              <option value="12" {% if resident.nationality == 12 %}selected{% endif %}>侗族</option>
              <option value="13" {% if resident.nationality == 13 %}selected{% endif %}>瑶族</option>
              <option value="14" {% if resident.nationality == 14 %}selected{% endif %}>白族</option>
              <option value="15" {% if resident.nationality == 15 %}selected{% endif %}>土家族</option>
              <option value="16" {% if resident.nationality == 16 %}selected{% endif %}>哈尼族</option>
              <option value="17" {% if resident.nationality == 17 %}selected{% endif %}>哈萨克族</option>
              <option value="18" {% if resident.nationality == 18 %}selected{% endif %}>傣族</option>
              <option value="19" {% if resident.nationality == 19 %}selected{% endif %}>黎族</option>
              <option value="20" {% if resident.nationality == 20 %}selected{% endif %}>傈僳族</option>
              <option value="21" {% if resident.nationality == 21 %}selected{% endif %}>佤族</option>
              <option value="22" {% if resident.nationality == 22 %}selected{% endif %}>畲族</option>
              <option value="23" {% if resident.nationality == 23 %}selected{% endif %}>高山族</option>
              <option value="24" {% if resident.nationality == 24 %}selected{% endif %}>拉祜族</option>
              <option value="25" {% if resident.nationality == 25 %}selected{% endif %}>水族</option>
              <option value="26" {% if resident.nationality == 26 %}selected{% endif %}>东乡族</option>
              <option value="27" {% if resident.nationality == 27 %}selected{% endif %}>纳西族</option>
              <option value="28" {% if resident.nationality == 28 %}selected{% endif %}>景颇族</option>
              <option value="29" {% if resident.nationality == 29 %}selected{% endif %}>柯尔克孜族</option>
              <option value="30" {% if resident.nationality == 30 %}selected{% endif %}>土族</option>
              <option value="31" {% if resident.nationality == 31 %}selected{% endif %}>达斡尔族</option>
              <option value="32" {% if resident.nationality == 32 %}selected{% endif %}>仫佬族</option>
              <option value="33" {% if resident.nationality == 33 %}selected{% endif %}>羌族</option>
              <option value="34" {% if resident.nationality == 34 %}selected{% endif %}>布朗族</option>
              <option value="35" {% if resident.nationality == 35 %}selected{% endif %}>撒拉族</option>
              <option value="36" {% if resident.nationality == 36 %}selected{% endif %}>毛难族</option>
              <option value="37" {% if resident.nationality == 37 %}selected{% endif %}>仡佬族</option>
              <option value="38" {% if resident.nationality == 38 %}selected{% endif %}>锡伯族</option>
              <option value="39" {% if resident.nationality == 39 %}selected{% endif %}>阿昌族</option>
              <option value="40" {% if resident.nationality == 40 %}selected{% endif %}>普米族</option>
              <option value="41" {% if resident.nationality == 41 %}selected{% endif %}>塔吉克族</option>
              <option value="42" {% if resident.nationality == 42 %}selected{% endif %}>怒族</option>
              <option value="43" {% if resident.nationality == 43 %}selected{% endif %}>乌孜别克族</option>
              <option value="44" {% if resident.nationality == 44 %}selected{% endif %}>俄罗斯族</option>
              <option value="45" {% if resident.nationality == 45 %}selected{% endif %}>鄂温克族</option>
              <option value="46" {% if resident.nationality == 46 %}selected{% endif %}>崩龙族</option>
              <option value="47" {% if resident.nationality == 47 %}selected{% endif %}>保安族</option>
              <option value="48" {% if resident.nationality == 48 %}selected{% endif %}>裕固族</option>
              <option value="49" {% if resident.nationality == 49 %}selected{% endif %}>京族</option>
              <option value="50" {% if resident.nationality == 50 %}selected{% endif %}>塔塔尔族</option>
              <option value="51" {% if resident.nationality == 51 %}selected{% endif %}>独龙族</option>
              <option value="52" {% if resident.nationality == 52 %}selected{% endif %}>鄂伦春族</option>
              <option value="53" {% if resident.nationality == 53 %}selected{% endif %}>赫哲族</option>
              <option value="54" {% if resident.nationality == 54 %}selected{% endif %}>门巴族</option>
              <option value="55" {% if resident.nationality == 55 %}selected{% endif %}>珞巴族</option>
              <option value="56" {% if resident.nationality == 56 %}selected{% endif %}>基诺族</option>
              <option value="57" {% if resident.nationality == 57 %}selected{% endif %}>其他</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">身份证号 *</label>
            <input type="text" id="edit-resident-id-card" name="id_card" required value="{{ resident.id_card }}"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
            <input type="tel" id="edit-resident-phone" name="phone" value="{{ resident.phone|default:'' }}"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">所属家庭</label>
            <div class="relative">
                <input type="text" id="edit_modal_family_search" placeholder="输入户号、房主姓名或联系电话搜索" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                    <i class="fa fa-search"></i>
                </div>
            </div>
            <select name="family" id="edit-resident-family" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent mt-2">
                <option value="" {% if not resident.family %}selected{% endif %}>请选择</option>
                {% if resident.family %}
                    <option value="{{ resident.family.id }}" selected>{{ resident.family.household_number }} - {{ resident.family.owner_name }} ({{ resident.family.contact_phone|default:'' }})</option>
                {% endif %}
            </select>
            <div id="edit_modal_family_search_result" class="text-sm text-gray-500 mt-1"></div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">政治面貌</label>
            <select name="political_status" id="edit-resident-political-status"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="" {% if not resident.political_status %}selected{% endif %}>请选择</option>
              <option value="1" {% if resident.political_status == 1 %}selected{% endif %}>中国共产党党员</option>
              <option value="2" {% if resident.political_status == 2 %}selected{% endif %}>中国共产党预备党员</option>
              <option value="3" {% if resident.political_status == 3 %}selected{% endif %}>中国共产主义青年团团员</option>
              <option value="4" {% if resident.political_status == 4 %}selected{% endif %}>中国国民党革命委员会党员</option>
              <option value="5" {% if resident.political_status == 5 %}selected{% endif %}>中国民主同盟盟员</option>
              <option value="6" {% if resident.political_status == 6 %}selected{% endif %}>中国民主建国会会员</option>
              <option value="7" {% if resident.political_status == 7 %}selected{% endif %}>中国民主促进会会员</option>
              <option value="8" {% if resident.political_status == 8 %}selected{% endif %}>中国农工民主党党员</option>
              <option value="9" {% if resident.political_status == 9 %}selected{% endif %}>中国致公党党员</option>
              <option value="10" {% if resident.political_status == 10 %}selected{% endif %}>九三学社社员</option>
              <option value="11" {% if resident.political_status == 11 %}selected{% endif %}>台湾民主自治同盟盟员</option>
              <option value="12" {% if resident.political_status == 12 %}selected{% endif %}>无党派民主人士</option>
              <option value="13" {% if resident.political_status == 13 %}selected{% endif %}>群众</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">婚姻状态</label>
            <select name="marital_status" id="edit-resident-marital-status"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="" {% if not resident.marital_status %}selected{% endif %}>请选择</option>
              <option value="1" {% if resident.marital_status == 1 %}selected{% endif %}>未婚</option>
              <option value="2" {% if resident.marital_status == 2 %}selected{% endif %}>已婚</option>
              <option value="3" {% if resident.marital_status == 3 %}selected{% endif %}>离异</option>
              <option value="4" {% if resident.marital_status == 4 %}selected{% endif %}>丧偶</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">学历</label>
            <select name="education" id="edit-resident-education"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="" {% if not resident.education %}selected{% endif %}>请选择</option>
              <option value="1" {% if resident.education == 1 %}selected{% endif %}>文盲</option>
              <option value="2" {% if resident.education == 2 %}selected{% endif %}>小学</option>
              <option value="3" {% if resident.education == 3 %}selected{% endif %}>初中</option>
              <option value="4" {% if resident.education == 4 %}selected{% endif %}>高中</option>
              <option value="5" {% if resident.education == 5 %}selected{% endif %}>大专</option>
              <option value="6" {% if resident.education == 6 %}selected{% endif %}>本科</option>
              <option value="7" {% if resident.education == 7 %}selected{% endif %}>硕士</option>
              <option value="8" {% if resident.education == 8 %}selected{% endif %}>博士</option>
              <option value="9" {% if resident.education == 9 %}selected{% endif %}>其他</option>
            </select>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="edit-resident-job" name="job" {% if resident.job %}checked{% endif %}>
            <label for="edit-resident-job">是否有工作</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="edit-resident-is_dead" name="is_dead" {% if resident.is_dead %}checked{% endif %}>
            <label for="edit-resident-is_dead">是否死亡</label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
          <textarea id="edit-resident-remark" name="remark" rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">{{ resident.remark|default:'' }}</textarea>
        </div>
      </form>
    </div>
    <!-- 弹窗底部 -->
    <div class="bg-gray-50 px-6 py-4 flex items-center justify-end space-x-3">
      <a href="/test/" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-transparent">取消</a>
      <button type="submit" form="edit-resident-form"
        class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">保存</button>
    </div>
  </div>
</div>

<script>
    // 编辑弹窗中的家庭搜索功能
    document.addEventListener('DOMContentLoaded', function() {
        const familySearchInput = document.getElementById('edit_modal_family_search');
        const familySelect = document.getElementById('edit-resident-family');
        const searchResultDiv = document.getElementById('edit_modal_family_search_result');
        let searchTimeout;
        const currentFamilyId = {{ resident.family_id|default:'null' }};
        
        // 确保元素存在
        if (familySearchInput && familySelect && searchResultDiv) {
            familySearchInput.addEventListener('input', function() {
                // 清空搜索结果
                searchResultDiv.textContent = '';
                
                // 清除之前的搜索超时
                clearTimeout(searchTimeout);
                
                const searchQuery = familySearchInput.value.trim();
                
                if (searchQuery.length < 1) {
                    // 如果搜索内容为空，重置下拉列表，保留当前选择
                    let optionsHtml = '<option value="">请选择</option>';
                    if (currentFamilyId) {
                        // 如果当前有选择的家庭，保留该选项
                        fetch(`/api/families/${currentFamilyId}/`)
                            .then(response => response.json())
                            .then(family => {
                                optionsHtml += `<option value="${family.id}" selected>${family.household_number} - ${family.owner_name} (${family.contact_phone || '-'})</option>`;
                                familySelect.innerHTML = optionsHtml;
                            })
                            .catch(error => {
                                console.error('获取当前家庭失败:', error);
                                familySelect.innerHTML = optionsHtml;
                            });
                    } else {
                        familySelect.innerHTML = optionsHtml;
                    }
                    return;
                }
                
                // 设置搜索超时，避免频繁请求
                searchTimeout = setTimeout(function() {
                    searchResultDiv.textContent = '搜索中...';
                    
                    // 构建搜索URL
                    const searchUrl = `/api/families/?search=${encodeURIComponent(searchQuery)}`;
                    
                    // 发送搜索请求
                    fetch(searchUrl)
                        .then(response => response.json())
                        .then(data => {
                            const families = data.results || [];
                            
                            // 更新下拉列表
                            let optionsHtml = '<option value="">请选择</option>';
                            if (families.length > 0) {
                                families.forEach(family => {
                                    const selected = family.id == currentFamilyId ? 'selected' : '';
                                    optionsHtml += `<option value="${family.id}" ${selected}>${family.household_number} - ${family.owner_name} (${family.contact_phone || '-'})</option>`;
                                });
                                searchResultDiv.textContent = `找到 ${families.length} 个家庭`;
                            } else {
                                searchResultDiv.textContent = '没有找到匹配的家庭';
                            }
                            familySelect.innerHTML = optionsHtml;
                        })
                        .catch(error => {
                            console.error('搜索家庭失败:', error);
                            searchResultDiv.textContent = '搜索失败，请稍后重试';
                        });
                }, 300);
            });
        }
    });
</script>
{% endblock %}
