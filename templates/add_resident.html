<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加居民</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .form-container {
            background-color: #f0f8ff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #b3d9ff;
            max-width: 800px;
            margin: 0 auto;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            min-width: 250px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            color: #007bff;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>添加居民</h1>
    
    <div class="form-container">
        <!-- 显示消息 -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="gender">性别</label>
                    <select id="gender" name="gender">
                        <option value="">请选择</option>
                        <option value="1">男</option>
                        <option value="2">女</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nationality">民族</label>
                    <select id="nationality" name="nationality">
                        <option value="">请选择</option>
                        <option value="1">汉族</option>
                        <option value="2">蒙古族</option>
                        <option value="3">回族</option>
                        <option value="4">藏族</option>
                        <option value="5">维吾尔族</option>
                        <option value="6">苗族</option>
                        <option value="7">彝族</option>
                        <option value="8">壮族</option>
                        <option value="9">布依族</option>
                        <option value="10">朝鲜族</option>
                        <option value="11">满族</option>
                        <option value="12">侗族</option>
                        <option value="13">瑶族</option>
                        <option value="14">白族</option>
                        <option value="15">土家族</option>
                        <option value="16">哈尼族</option>
                        <option value="17">哈萨克族</option>
                        <option value="18">傣族</option>
                        <option value="19">黎族</option>
                        <option value="20">傈僳族</option>
                        <option value="21">佤族</option>
                        <option value="22">畲族</option>
                        <option value="23">高山族</option>
                        <option value="24">拉祜族</option>
                        <option value="25">水族</option>
                        <option value="26">东乡族</option>
                        <option value="27">纳西族</option>
                        <option value="28">景颇族</option>
                        <option value="29">柯尔克孜族</option>
                        <option value="30">土族</option>
                        <option value="31">达斡尔族</option>
                        <option value="32">仫佬族</option>
                        <option value="33">羌族</option>
                        <option value="34">布朗族</option>
                        <option value="35">撒拉族</option>
                        <option value="36">毛难族</option>
                        <option value="37">仡佬族</option>
                        <option value="38">锡伯族</option>
                        <option value="39">阿昌族</option>
                        <option value="40">普米族</option>
                        <option value="41">塔吉克族</option>
                        <option value="42">怒族</option>
                        <option value="43">乌孜别克族</option>
                        <option value="44">俄罗斯族</option>
                        <option value="45">鄂温克族</option>
                        <option value="46">崩龙族</option>
                        <option value="47">保安族</option>
                        <option value="48">裕固族</option>
                        <option value="49">京族</option>
                        <option value="50">塔塔尔族</option>
                        <option value="51">独龙族</option>
                        <option value="52">鄂伦春族</option>
                        <option value="53">赫哲族</option>
                        <option value="54">门巴族</option>
                        <option value="55">珞巴族</option>
                        <option value="56">基诺族</option>
                        <option value="57">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="id_card">身份证号 *</label>
                    <input type="text" id="id_card" name="id_card" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">联系电话</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div class="form-group">
                    <label for="family_search">所属家庭</label>
                    <div class="relative">
                        <input type="text" id="family_search" placeholder="输入户号、房主姓名或联系电话搜索" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa fa-search"></i>
                        </div>
                    </div>
                    <select id="family" name="family" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent mt-2">
                        <option value="">请选择</option>
                    </select>
                    <div id="family_search_result" class="text-sm text-gray-500 mt-1"></div>
                </div>
            </div>
            
            <script>
                // 家庭搜索功能
                document.addEventListener('DOMContentLoaded', function() {
                    const familySearchInput = document.getElementById('family_search');
                    const familySelect = document.getElementById('family');
                    const searchResultDiv = document.getElementById('family_search_result');
                    let searchTimeout;
                    
                    familySearchInput.addEventListener('input', function() {
                        // 清空搜索结果
                        searchResultDiv.textContent = '';
                        
                        // 清除之前的搜索超时
                        clearTimeout(searchTimeout);
                        
                        const searchQuery = familySearchInput.value.trim();
                        
                        if (searchQuery.length < 1) {
                            // 如果搜索内容为空，重置下拉列表
                            familySelect.innerHTML = '<option value="">请选择</option>';
                            return;
                        }
                        
                        // 设置搜索超时，避免频繁请求
                        searchTimeout = setTimeout(function() {
                            searchResultDiv.textContent = '搜索中...';
                            
                            // 构建搜索URL
                            const searchUrl = `/api/families/?search=${encodeURIComponent(searchQuery)}`;
                            
                            // 发送搜索请求
                            fetch(searchUrl)
                                .then(response => response.json())
                                .then(data => {
                                    const families = data.results || [];
                                    
                                    // 更新下拉列表
                                    let optionsHtml = '<option value="">请选择</option>';
                                    if (families.length > 0) {
                                        families.forEach(family => {
                                            optionsHtml += `<option value="${family.id}">${family.household_number} - ${family.owner_name} (${family.contact_phone || '-'})</option>`;
                                        });
                                        searchResultDiv.textContent = `找到 ${families.length} 个家庭`;
                                    } else {
                                        searchResultDiv.textContent = '没有找到匹配的家庭';
                                    }
                                    familySelect.innerHTML = optionsHtml;
                                })
                                .catch(error => {
                                    console.error('搜索家庭失败:', error);
                                    searchResultDiv.textContent = '搜索失败，请稍后重试';
                                });
                        }, 300);
                    });
                });
            </script>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="political_status">政治面貌</label>
                    <select id="political_status" name="political_status">
                        <option value="">请选择</option>
                        <option value="1">中国共产党党员</option>
                        <option value="2">中国共产党预备党员</option>
                        <option value="3">中国共产主义青年团团员</option>
                        <option value="4">中国国民党革命委员会党员</option>
                        <option value="5">中国民主同盟盟员</option>
                        <option value="6">中国民主建国会会员</option>
                        <option value="7">中国民主促进会会员</option>
                        <option value="8">中国农工民主党党员</option>
                        <option value="9">中国致公党党员</option>
                        <option value="10">九三学社社员</option>
                        <option value="11">台湾民主自治同盟盟员</option>
                        <option value="12">无党派民主人士</option>
                        <option value="13">群众</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="marital_status">婚姻状态</label>
                    <select id="marital_status" name="marital_status">
                        <option value="">请选择</option>
                        <option value="1">未婚</option>
                        <option value="2">已婚</option>
                        <option value="3">离异</option>
                        <option value="4">丧偶</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="education">学历</label>
                    <select id="education" name="education">
                        <option value="">请选择</option>
                        <option value="1">文盲</option>
                        <option value="2">小学</option>
                        <option value="3">初中</option>
                        <option value="4">高中</option>
                        <option value="5">大专</option>
                        <option value="6">本科</option>
                        <option value="7">硕士</option>
                        <option value="8">博士</option>
                        <option value="9">其他</option>
                    </select>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="job" name="job">
                    <label for="job">是否有工作</label>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="is_dead" name="is_dead">
                    <label for="is_dead">是否死亡</label>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 100%;">
                    <label for="remark">备注</label>
                    <textarea id="remark" name="remark"></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="reset" class="btn btn-secondary">重置</button>
            </div>
        </form>
        
        <a href="/test/" class="back-link">返回居民列表</a>
    </div>
</body>
</html>
